// Keep frontend builds reproducible and independent from system Node.js installations.
node {
    version = '22.23.2'
    download = true
}

tasks.register("removeCustomNode", Delete) {
    delete node.workDir
    delete node.npmWorkDir
    delete node.yarnWorkDir
}

// npm ci must run from the workspace root to read the lockfile instead of rewriting it.
// There @quak/* gets linked into node_modules
tasks.named("npm_ci") {
    workingDir = layout.projectDirectory.file("..")
}

tasks.named("npm_run_build") {
    dependsOn {
        tasks.named("npm_ci")
    }
    workingDir = layout.projectDirectory.file("../frontend")
}
