# ================================
# Demo Profile Configuration
# ================================
# Presentation mode: no login at all. Every browser that opens the app is signed
# in automatically as its own numbered account -- Testnutzer1, Testnutzer2, ... --
# so visitors trying it side by side do not land in each other's projects.
#
# Start it with:  ./gradlew bootRun --args='--spring.profiles.active=demo'
#
# WARNING: this profile disables authentication. Anyone who can reach the port is
# signed in. Use it on a laptop or a closed network, never on a public host.

# File-backed H2, so no database server has to be running and projects prepared
# before the talk survive a restart. Delete backend/data to start from scratch.
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.url=jdbc:h2:file:${DEMO_DB_PATH:./data/quak-demo};DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Account naming. The issuer is always "local"; the name doubles as the subject
# that DemoSecurityConfig authenticates as.
app.demo.name-prefix=Testnutzer

# A visitor keeps their projects for as long as their session lives, so give a
# talk more room than the default hour.
server.servlet.session.timeout=8h

# Same origin as the backend, which is how the production jar serves the built
# frontend. Override with APP_FRONTEND_URL when running `npm run dev` separately.
app.frontend.url=${APP_FRONTEND_URL:http://localhost:8080}
