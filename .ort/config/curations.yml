# Packages whose metadata names a license that ORT cannot map to an SPDX id, or none at all.
- id: "Maven:org.antlr:ST4:4.3.4"
  curations:
    comment: "The POM declares 'The BSD License' and links https://www.antlr.org/license.html, which is BSD-3-Clause."
    declared_license_mapping:
      "The BSD License": "BSD-3-Clause"
- id: "Maven:org.abego.treelayout:org.abego.treelayout.core:1.0.3"
  curations:
    comment: "The POM declares BSD-3-Clause in a form ORT does not map."
    declared_license_mapping:
      "BSD 3-Clause \"New\" or \"Revised\" License (BSD-3-Clause)": "BSD-3-Clause"
- id: "PyPI::mypy-extensions:1.1.0"
  curations:
    comment: "PyPI has no license metadata. The repository's LICENSE file and deps.dev state MIT."
    concluded_license: "MIT"
