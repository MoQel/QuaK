name: PR CI Pipeline

on:
  push:
    branches:
      - "development"
      - "main"
  pull_request:
    branches:
      - "development"
      - "main"
      - "merge/**"
      - "feature/**"

jobs:
  test:
    name: test
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.head_ref }}

      - name: Set up JDK 21
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      - name: Check Code Formatting (Spotless)
        if: github.event_name == 'pull_request'
        run: |
          cd backend
          ./gradlew spotlessCheck || {
            echo "❌ Code formatting check failed!"
            echo ""
            echo "Please run the following command locally to fix formatting:"
            echo "  cd backend && ./gradlew spotlessApply"
            echo ""
            echo "Then commit and push the changes."
            exit 1
          }

      - name: Run Tests
        run: cd backend && ./gradlew :test

  build:
    name: build
    needs: test
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      - name: Build with Gradle
        run: cd backend && ./gradlew :bootJar

  production-image:
    name: production image
    needs: test
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Build production image
        run: docker build --build-arg SKIP_FRONTEND=false --tag quak-production:test --file backend/Dockerfile .

      - name: Smoke test production runtime
        run: |
          docker run --rm --entrypoint /bin/sh quak-production:test -c '
            test "$(id -u)" = "10001"
            test -x /opt/lsp/python/bin/pylsp
            test -x /opt/lsp/qasm/qasmlsp
            test -w /var/lib/quak/lsp-workspace
            /opt/lsp/python/bin/pylsp --version
            /opt/lsp/qasm/qasmlsp --help >/dev/null
          '

  generate-openapi:
    name: generate-openapi
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      - name: Generate OpenAPI YAML
        run: cd backend && ./gradlew generateOpenApiDocs
        
      - name: Upload OpenAPI Spec
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: openapi-spec
          path: docs/api/openapi.yaml

      - name: Commit and Push OpenAPI Spec
        if: github.event_name == 'push'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add docs/api/openapi.yaml
          git diff --quiet && git diff --staged --quiet || (git commit -m "docs: automated update of openapi spec" && git pull --rebase origin ${{ github.head_ref || github.ref_name }} && git push)

  js-checks:
    name: js checks
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Lint
        run: npm run lint

      # Shared packages/ must not import from frontend/.
      - name: Check package boundaries (dependency-cruiser)
        run: npm run lint:boundaries

      # The TS parser is generated from the same .g4 the backend uses and is
      # committed (this job has no JDK). Fails if the grammars moved without it.
      - name: Check the generated QASM parser is current
        run: npm run check:generated

      - name: Typecheck (frontend, packages, extension)
        run: npm run typecheck

      - name: Frontend tests
        run: npm run test:frontend

      - name: Shared package tests (QASM transform)
        run: npm run test:packages

      - name: Extension unit tests
        run: npm run test:extension

      - name: Build extension
        run: npm run build:extension

      # Packaging is where a stray runtime dependency would drag .git and .env
      # into a published extension, so the artifact is checked on every push.
      - name: Package extension and check the vsix
        run: npm run package:extension

      # Runs a real VSCode, which needs a virtual display on Linux.
      - name: Extension integration tests
        run: xvfb-run -a npm run test:extension:integration
