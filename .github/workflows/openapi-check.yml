name: OpenAPI

# Checks that docs/api/openapi.yaml matches the specification generated from the backend controllers.

on:
  push:
    branches:
      - "development"
      - "main"
  pull_request:
    branches:
      - "development"
      - "main"
  workflow_dispatch:

concurrency:
  group: openapi-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  spec-up-to-date:
    name: spec-up-to-date
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up JDK 21
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      - name: Generate OpenAPI spec
        run: cd backend && ./gradlew generateOpenApiDocs

      - name: Check docs/api/openapi.yaml
        run: |
          git diff --exit-code docs/api/openapi.yaml > openapi.diff && exit 0
          FIX="Run 'cd backend && ./gradlew generateOpenApiDocs' and commit docs/api/openapi.yaml. After a merge conflict in that file, run the task again instead of resolving it by hand."
          {
            echo "The API changed, but docs/api/openapi.yaml is out of date. $FIX"
            echo '```diff'
            head -c 60000 openapi.diff
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error file=docs/api/openapi.yaml::The API changed, but docs/api/openapi.yaml is out of date. $FIX"
          exit 1

      - name: Upload generated OpenAPI spec
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: openapi-spec
          path: docs/api/openapi.yaml
