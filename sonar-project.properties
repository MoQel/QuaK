# SonarQube Cloud, CI-based analysis of the whole repository as one project.
# Run by .github/workflows/sonar.yml. Files ignored by git are skipped automatically.
sonar.projectKey=moqel_QuaK
sonar.organization=moqel

sonar.sources=.
sonar.tests=.
sonar.test.inclusions=**/src/test/**,**/*.test.ts,**/*.test.tsx
sonar.exclusions=**/src/test/**,**/*.test.ts,**/*.test.tsx,packages/qasm-transform/src/generated/**
# Build configs and tooling scripts have no tests
sonar.coverage.exclusions=**/*.config.*,**/*.mjs

# Java. Classes and libraries come from ./gradlew test jacocoTestReport sonarLibraries
sonar.java.source=21
sonar.java.binaries=backend/build/classes/java/main
sonar.java.libraries=backend/build/sonar-libs/main/*.jar
sonar.java.test.binaries=backend/build/classes/java/test
sonar.java.test.libraries=backend/build/sonar-libs/test/*.jar

# Coverage
sonar.coverage.jacoco.xmlReportPaths=backend/build/reports/jacoco/test/jacocoTestReport.xml
sonar.javascript.lcov.reportPaths=coverage/lcov.info
