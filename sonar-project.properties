# SonarQube Cloud, CI-based analysis of the whole repository as one project.
# Run by .github/workflows/sonar.yml. The scanner detects the Gradle backend and the npm
# workspaces itself, including Java classes, libraries, test files and the JaCoCo report.
# Files ignored by git are skipped.
sonar.projectKey=moqel_QuaK
sonar.organization=moqel
sonar.projectName=QuaK

sonar.exclusions=packages/qasm-transform/src/generated/**,**/*.png,**/*.jar,**/*.woff2
# Build configs and tooling scripts have no tests
sonar.coverage.exclusions=**/*.config.*,**/*.mjs

sonar.javascript.lcov.reportPaths=coverage/lcov.info
