components:
  schemas:
    ProblemDetail:
      type: object
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
          format: int32
        detail:
          type: string
        instance:
          type: string
          format: uri
        properties:
          type: object
          additionalProperties:
            type: object
    FileContentRequest:
      type: object
      properties:
        content:
          type: string
          format: byte
      required:
      - content
    UpdateEditorStateRequest:
      type: object
      properties:
        tabsJson:
          type: string
    EditorStateResponse:
      type: object
      properties:
        projectId:
          type: string
        tabsJson:
          type: string
    ClassicRegisterResponse:
      allOf:
      - $ref: "#/components/schemas/RegisterResponse"
      - type: object
        properties:
          numberOfBits:
            type: integer
            format: int32
    CompositeQuantumGateDto:
      allOf:
      - $ref: "#/components/schemas/QuantumOperationDto"
      - type: object
        properties:
          portLabels:
            type: array
            items:
              type: string
          usedQubitPositions:
            type: array
            items:
              type: integer
              format: int32
      - type: object
        properties:
          portLabels:
            type: array
            items:
              type: string
          usedQubitPositions:
            type: array
            items:
              type: integer
              format: int32
          body:
            type: array
            items:
              $ref: "#/components/schemas/QuantumOperationDto"
    ElementSelectorDto:
      type: object
      properties:
        registerId:
          type: string
        index:
          type: integer
          format: int32
    ElementaryQuantumGateDto:
      allOf:
      - $ref: "#/components/schemas/QuantumOperationDto"
      - type: object
        properties:
          rotationAngle:
            type: number
            format: double
    LayerResponse:
      type: object
      properties:
        quantumOperations:
          type: array
          items:
            oneOf:
            - $ref: "#/components/schemas/CompositeQuantumGateDto"
            - $ref: "#/components/schemas/ElementaryQuantumGateDto"
            - $ref: "#/components/schemas/MeasurementDto"
            - $ref: "#/components/schemas/SubcircuitOperationDto"
    LoopBlockDto:
      type: object
      properties:
        id:
          type: string
        repeatCount:
          type: integer
          format: int32
        operationIds:
          type: array
          items:
            type: string
    MeasurementDto:
      allOf:
      - $ref: "#/components/schemas/QuantumOperationDto"
      - type: object
        properties:
          classicBits:
            type: array
            items:
              $ref: "#/components/schemas/ElementSelectorDto"
    QuantumOperationDto:
      type: object
      discriminator:
        propertyName: type
      properties:
        id:
          type: string
        identifier:
          type: string
        inverseForm:
          type: boolean
        targetQubits:
          type: array
          items:
            $ref: "#/components/schemas/ElementSelectorDto"
        controlQubits:
          type: array
          items:
            $ref: "#/components/schemas/ElementSelectorDto"
        type:
          type: string
      required:
      - type
    QuantumRegisterResponse:
      allOf:
      - $ref: "#/components/schemas/RegisterResponse"
      - type: object
        properties:
          numberOfQubits:
            type: integer
            format: int32
    RegisterResponse:
      type: object
      discriminator:
        propertyName: type
      properties:
        id:
          type: string
        name:
          type: string
        type:
          type: string
      required:
      - type
    SubcircuitOperationDto:
      allOf:
      - $ref: "#/components/schemas/QuantumOperationDto"
      - type: object
        properties:
          definitionCircuitId:
            type: string
          subcircuitQubitIndices:
            type: array
            items:
              type: integer
              format: int32
          definitionName:
            type: string
          bindingError:
            type: string
      - type: object
        properties:
          definitionCircuitId:
            type: string
          subcircuitQubitIndices:
            type: array
            items:
              type: integer
              format: int32
          definitionName:
            type: string
          body:
            type: array
            items:
              $ref: "#/components/schemas/QuantumOperationDto"
          bindingError:
            type: string
    UpdateCircuitRequest:
      type: object
      properties:
        registers:
          type: array
          items:
            oneOf:
            - $ref: "#/components/schemas/ClassicRegisterResponse"
            - $ref: "#/components/schemas/QuantumRegisterResponse"
        layers:
          type: array
          items:
            $ref: "#/components/schemas/LayerResponse"
        loopBlocks:
          type: array
          items:
            $ref: "#/components/schemas/LoopBlockDto"
    CircuitResponse:
      type: object
      properties:
        id:
          type: string
        projectId:
          type: string
        fileId:
          type: string
        registers:
          type: array
          items:
            oneOf:
            - $ref: "#/components/schemas/ClassicRegisterResponse"
            - $ref: "#/components/schemas/QuantumRegisterResponse"
        layers:
          type: array
          items:
            $ref: "#/components/schemas/LayerResponse"
        loopBlocks:
          type: array
          items:
            $ref: "#/components/schemas/LoopBlockDto"
    ProjectRoleRequest:
      type: object
      properties:
        userId:
          type: string
        role:
          type: string
      required:
      - role
      - userId
    ProjectRoleResponse:
      type: object
      properties:
        userId:
          type: string
          format: uuid
        projectId:
          type: string
        role:
          type: string
        email:
          type: string
        name:
          type: string
        avatarUrl:
          type: string
    ProjectRequest:
      type: object
      properties:
        name:
          type: string
      required:
      - name
    ProjectDetailsResponse:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        type:
          type: string
        createdOn:
          type: string
          format: date-time
        lastAccess:
          type: string
          format: date-time
        owner:
          $ref: "#/components/schemas/UserResponse"
    UserResponse:
      type: object
      properties:
        userId:
          type: string
          format: uuid
        email:
          type: string
        name:
          type: string
        avatarUrl:
          type: string
        emailVerified:
          type: boolean
    CreateFileRequest:
      type: object
      properties:
        name:
          type: string
      required:
      - name
    FileDetailsResponse:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        type:
          type: string
        createdOn:
          type: string
          format: date-time
        lastAccess:
          type: string
          format: date-time
    DirectoryRequest:
      type: object
      properties:
        name:
          type: string
      required:
      - name
    DirectoryDetailsResponse:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        type:
          type: string
        createdOn:
          type: string
          format: date-time
        lastAccess:
          type: string
          format: date-time
    RegisterRequest:
      type: object
      properties:
        name:
          type: string
        type:
          type: string
          enum:
          - Quantum_Register
          - Classic_Register
        size:
          type: integer
          format: int32
    AddQuantumOperationRequest:
      type: object
      properties:
        quantumOperation:
          oneOf:
          - $ref: "#/components/schemas/CompositeQuantumGateDto"
          - $ref: "#/components/schemas/ElementaryQuantumGateDto"
          - $ref: "#/components/schemas/MeasurementDto"
          - $ref: "#/components/schemas/SubcircuitOperationDto"
        layerIdx:
          type: integer
          format: int32
    GeneratedCodeResponse:
      type: object
      properties:
        code:
          type: string
    CircuitContentResponse:
      type: object
      properties:
        registers:
          type: array
          items:
            oneOf:
            - $ref: "#/components/schemas/ClassicRegisterResponse"
            - $ref: "#/components/schemas/QuantumRegisterResponse"
        layers:
          type: array
          items:
            $ref: "#/components/schemas/LayerResponse"
        loopBlocks:
          type: array
          items:
            $ref: "#/components/schemas/LoopBlockDto"
    RestLogoutResponse:
      type: object
      properties:
        message:
          type: string
    RenameFileRequest:
      type: object
      properties:
        name:
          type: string
      required:
      - name
    MoveQuantumOperationRequest:
      type: object
      properties:
        quantumOperationId:
          type: string
        layerIdx:
          type: integer
          format: int32
        targetQubits:
          type: array
          items:
            $ref: "#/components/schemas/ElementSelectorDto"
        controlQubits:
          type: array
          items:
            $ref: "#/components/schemas/ElementSelectorDto"
        classicBits:
          type: array
          items:
            $ref: "#/components/schemas/ElementSelectorDto"
    FileElementDto:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        type:
          type: string
        createdOn:
          type: string
          format: date-time
        lastAccess:
          type: string
          format: date-time
    ProjectContentsResponse:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        type:
          type: string
        contents:
          type: array
          items:
            $ref: "#/components/schemas/FileElementDto"
        createdOn:
          type: string
          format: date-time
        lastAccess:
          type: string
          format: date-time
    InspectorInfoResponse:
      type: object
      properties:
        operatorDefinition:
          type: string
        truthTable:
          type: array
          items:
            $ref: "#/components/schemas/TruthTableEntryResponse"
        matrix:
          $ref: "#/components/schemas/MatrixInfoResponse"
    MatrixInfoResponse:
      type: object
      properties:
        display:
          type: string
        rows:
          type: integer
          format: int32
        cols:
          type: integer
          format: int32
        computable:
          type: array
          items:
            type: array
            items:
              type: string
    OperationDefinitionResponse:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        category:
          type: string
        description:
          type: string
        qubitCount:
          type: integer
          format: int32
        symbol:
          type: string
        parameters:
          type: array
          items:
            type: string
        inspectorInfo:
          $ref: "#/components/schemas/InspectorInfoResponse"
    TruthTableEntryResponse:
      type: object
      properties:
        input:
          type: string
        output:
          type: string
    FileContentResponse:
      type: object
      properties:
        content:
          type: string
          format: byte
    DirectoryContentsResponse:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        type:
          type: string
        contents:
          type: array
          items:
            $ref: "#/components/schemas/FileElementDto"
        createdOn:
          type: string
          format: date-time
        lastAccess:
          type: string
          format: date-time
    SubcircuitOptionResponse:
      type: object
      properties:
        circuitId:
          type: string
        fileId:
          type: string
        name:
          type: string
        qubitCount:
          type: integer
          format: int32
        operationCount:
          type: integer
          format: int32
    RestAuthStatusResponse:
      type: object
      properties:
        authenticated:
          type: boolean
        userId:
          type: string
          format: uuid
  securitySchemes:
    basicAuth:
      type: http
      description: "HTTP Basic Authentication (dev mode: admin/admin)"
      scheme: basic
